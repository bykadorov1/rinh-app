<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>РИНХ Активности</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--text:var(--tg-theme-text-color,#14181f);--hint:var(--tg-theme-hint-color,#6b7480);--btn:var(--tg-theme-button-color,#2f6fdb);--btnt:var(--tg-theme-button-text-color,#fff);--card:var(--tg-theme-secondary-bg-color,#f2f5f9)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
.hero{background:linear-gradient(135deg,#1c4fb0,#3d8ee8);color:#fff;padding:22px 16px 26px;border-radius:0 0 24px 24px}
.hero h1{margin:0 0 4px;font-size:22px}.hero p{margin:0;opacity:.9;font-size:14px}
.stat{display:inline-block;margin-top:12px;background:rgba(255,255,255,.2);border-radius:12px;padding:4px 10px;font-size:13px}
.wrap{padding:0 14px}
.search{width:100%;margin:-18px 0 10px;padding:12px 14px;border:0;border-radius:14px;background:var(--bg);color:var(--text);font-size:16px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.tabs{display:flex;gap:6px;margin:8px 0}
.tab{flex:1;border:0;border-radius:12px;padding:10px 4px;background:var(--card);color:var(--text);font-size:14px;font-weight:600}
.tab.on{background:var(--btn);color:var(--btnt)}
.row{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:18px;padding:8px 13px;background:var(--card);color:var(--text);font-size:14px}
.chip.on{background:var(--btn);color:var(--btnt)}
.sel{display:flex;gap:8px;margin-bottom:6px}
select{flex:1;padding:9px;border:0;border-radius:12px;background:var(--card);color:var(--text);font-size:14px}
.cnt{color:var(--hint);font-size:13px;margin:8px 2px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0}
.top{display:flex;gap:12px;align-items:flex-start}
.ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px}
.ti{flex:1;min-width:0}.ti b{display:block;font-size:16px}.ti span{color:var(--hint);font-size:14px}
.star{border:0;background:none;font-size:24px;padding:0;color:var(--text)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tag{font-size:12px;border-radius:8px;padding:3px 8px;background:var(--bg);color:var(--hint)}
.more{display:none;margin-top:12px;font-size:14px;border-top:1px solid rgba(128,128,128,.2);padding-top:10px}
.card.open .more{display:block}
.more p{margin:0 0 8px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.b{display:inline-block;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;text-decoration:none;background:var(--btn);color:var(--btnt)}
.b.alt{background:var(--bg);color:var(--text)}
.ev{display:flex;gap:12px;align-items:center}
.date{flex:none;width:58px;text-align:center;border-radius:12px;background:var(--btn);color:var(--btnt);padding:8px 2px;font-size:13px;font-weight:700;line-height:1.2}
.empty{text-align:center;color:var(--hint);margin:36px 0}
.note{font-size:12px;color:var(--hint);margin:18px 2px}
</style>
</head>
<body>
<div class="hero"><h1>🎓 Активности РГЭУ (РИНХ)</h1><p>Найди клуб, центр или секцию по интересам</p><span class="stat" id="stat"></span></div>
<div class="wrap">
<input class="search" id="q" type="search" placeholder="Поиск: спорт, волонтёры, КВН…">
<div class="tabs"><button class="tab on" data-t="all">Каталог</button><button class="tab" data-t="ev">События</button><button class="tab" data-t="fav">⭐ Избранное</button></div>
<div id="filters"></div><div id="list"></div>
<p class="note">Данные собраны из открытых источников (сайт rsue.ru, буклет для абитуриентов, университетская газета «Экономист»). Проверено 13.11.2026. Расписания и условия вступления уточняйте у организаторов.</p>
</div>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const I = {sport:"🏃 Спорт",science:"🔬 Наука",creative:"🎭 Творчество",volunteer:"🤝 Волонтёрство",business:"💼 Бизнес",it:"💻 IT",media:"🎥 Медиа",leadership:"🧭 Лидерство",service:"🛎 Сервис"};
const L = {"":"Любой уровень",beginner:"Новичок",middle:"Средний",pro:"Продвинутый"};
const F = {any:"Любой формат",offline:"Очно",online:"Онлайн"};
const S = "https://rsue.ru/studentam/", M = "sovetrgeurinh@yandex.ru";
const A = [
{id:"sovet",e:"🧭",t:"Студенческий совет",d:"Высший орган студенческого самоуправления: студенческие деканы факультетов, комитеты, медиа- и телевизионный клубы.",i:["leadership","media","volunteer"],l:["beginner","middle","pro"],f:"both",how:"Напишите на почту совета или приходите на Б. Садовую, 69.",url:S+"stud-sovet/",mail:M},
{id:"profkom",e:"🤝",t:"Профсоюзный комитет обучающихся",d:"Более 4 тысяч членов. Мероприятия, поддержка студентов, лидерское развитие и поездки по югу России.",i:["leadership","creative"],l:["beginner","middle","pro"],f:"both",how:"Вступить можно через профсоюзную организацию обучающихся.",url:S+"profkom/"},
{id:"skc",e:"🎤",t:"Студенческий культурный центр",d:"Творческие коллективы университета: вокал, ансамбли, концертные программы на праздниках вуза.",i:["creative"],l:["beginner","middle","pro"],f:"offline",how:"Состав коллективов и прослушивания уточняйте в центре.",url:S+"vosp-sport/"},
{id:"shtab",e:"🧢",t:"Штаб студенческих отрядов",d:"Студенческие отряды университета: работа и проекты, командный опыт, трудовой семестр.",i:["leadership","volunteer"],l:["beginner","middle"],f:"offline",how:"Набор объявляется через студсовет и штаб.",url:S+"stud-sovet/",mail:M},
{id:"vol",e:"💚",t:"Волонтёрский центр",d:"Добровольческие проекты и социальные акции университета. Есть утверждённое положение о центре.",i:["volunteer"],l:["beginner","middle","pro"],f:"offline",how:"Запись и анкеты уточняйте у студсовета.",url:S+"stud-sovet/",mail:M},
{id:"dorm",e:"🏠",t:"Студенческий совет общежития",d:"Подразделение студсовета: представляет интересы живущих в общежитиях, организует жизнь студгородка.",i:["leadership"],l:["beginner","middle"],f:"offline",how:"Обращайтесь в общежитии или через студсовет.",url:S+"vosp-sport/studencheskiy-sovet-obshchezhitiya/"},
{id:"kip",e:"💡",t:"Точка кипения РГЭУ (РИНХ)",d:"Площадка для проектных сессий, форумов и встреч со студентами, в том числе с ректором.",i:["business","science","leadership"],l:["middle","pro"],f:"offline",how:"Следите за анонсами мероприятий на сайте университета.",url:S},
{id:"sci",e:"🔬",t:"Студенческая наука",d:"Конференции и семинары, включая международные, научные проекты и участие в конкурсах.",i:["science"],l:["middle","pro"],f:"both",how:"Обратитесь на кафедру или в научный отдел.",url:S},
{id:"proj",e:"🚀",t:"Проектная деятельность",d:"Студенческие проекты и командная работа над реальными задачами.",i:["business","leadership"],l:["middle","pro"],f:"both",how:"Подробности в разделе «Проектная деятельность».",url:S},
{id:"cyber",e:"🎮",t:"Киберспортивный клуб",d:"Работает с 2021 года, оборудована площадка с мощными компьютерами для соревнований.",i:["sport","it"],l:["beginner","middle","pro"],f:"offline",how:"Состав и турниры уточняйте у организаторов клуба.",url:S},
{id:"chess",e:"♟",t:"Шахматный клуб имени Кудряшова",d:"Шахматный клуб университета, носит имя международного гроссмейстера Кудряшова.",i:["sport"],l:["beginner","middle","pro"],f:"offline",how:"Расписание уточняйте в университете.",url:S},
{id:"tour",e:"🥾",t:"Туристический и бильярдный клубы",d:"Клубы по интересам при университете: походы и бильярд.",i:["sport"],l:["beginner","middle"],f:"offline",how:"Контакты руководителей уточняйте в отделе воспитательной работы.",url:S+"vosp-sport/"},
{id:"sport",e:"🏅",t:"Спортивные секции и спартакиады",d:"В университете 4 спортивных комплекса, студенты участвуют в спартакиадах и соревнованиях.",i:["sport"],l:["beginner","middle","pro"],f:"offline",how:"Список секций и запись на кафедре физического воспитания.",url:S+"vosp-sport/"},
{id:"media",e:"🎥",t:"Медиацентр университета",d:"Университетские медиа: новости, фото и видео. Рядом работают медиа- и телевизионный клубы студсовета.",i:["media"],l:["beginner","middle","pro"],f:"both",how:"Набор в медиа-клубы объявляет студсовет.",url:S+"stud-sovet/",mail:M},
{id:"career",e:"🧑‍💼",t:"Центр развития карьеры",d:"Практики и стажировки на предприятиях Ростовской области и ЮФО, подготовка к трудоустройству.",i:["business"],l:["middle","pro"],f:"both",how:"Приходите в центр, расписание консультаций на сайте.",url:S},
{id:"mfc",e:"🛎",t:"Студенческий МФЦ",d:"Многофункциональный центр, открыт в январе 2026 года: сервисы и справки для студентов в одном месте.",i:["service"],l:["beginner","middle","pro"],f:"offline",how:"Работает как «единое окно». Услуги и график уточняйте в центре.",url:S}
];
const EV = [
{m:"17 фев",t:"День российских студенческих отрядов",d:"Встречи и дискуссии в Точке кипения (по материалам прошлых лет)."},
{m:"Весна",t:"«Студенческая весна»",d:"Ежегодный творческий праздник; в 2025 году прошёл 6 апреля."},
{m:"Ежегодно",t:"Фестиваль «Мы вместе!»",d:"Интернациональный межвузовский фестиваль, который проводится с 2008 года."},
{m:"Декабрь",t:"Премии «Золотые страницы РИНХа» и «Ветка каштана»",d:"Награждение лучших студентов и преподавателей."}
];
const st = {tab:"all",q:"",int:new Set(),lvl:"",fmt:"any",open:null};
let fav = new Set(); try { fav = new Set(JSON.parse(localStorage.getItem("fav")||"[]")); } catch(e){}
const save = () => { try { localStorage.setItem("fav", JSON.stringify([...fav])); } catch(e){} };
document.getElementById("stat").textContent = A.length + " активностей и центров";
const $ = id => document.getElementById(id);
function hit(a){ const q = st.q.trim().toLowerCase(); return !q || (a.t+" "+a.d+" "+a.i.map(x=>I[x]).join(" ")).toLowerCase().includes(q); }
function list(){
  const base = st.tab==="fav" ? A.filter(a=>fav.has(a.id)) : A;
  return base.map(a=>({a,s:a.i.filter(x=>st.int.has(x)).length})).filter(({a,s})=>hit(a)&&(!st.lvl||a.l.includes(st.lvl))&&(st.fmt==="any"||a.f==="both"||a.f===st.fmt)&&(!st.int.size||s>0)).sort((x,y)=>y.s-x.s).map(x=>x.a);
}
function el(h){ const d=document.createElement("div"); d.innerHTML=h; return d.firstElementChild; }
function filters(){
  const f=$("filters"); f.innerHTML="";
  if(st.tab!=="all") return;
  const row=el('<div class="row"></div>');
  for(const k in I){ const b=el('<button class="chip'+(st.int.has(k)?" on":"")+'">'+I[k]+'</button>'); b.onclick=()=>{st.int.has(k)?st.int.delete(k):st.int.add(k);render();}; row.appendChild(b); }
  f.appendChild(row);
  const s=el('<div class="sel"><select id="sl"></select><select id="sf"></select></div>');
  for(const k in L) s.children[0].add(new Option(L[k],k,0,k===st.lvl));
  for(const k in F) s.children[1].add(new Option(F[k],k,0,k===st.fmt));
  s.children[0].onchange=e=>{st.lvl=e.target.value;render();}; s.children[1].onchange=e=>{st.fmt=e.target.value;render();};
  f.appendChild(s);
}
function card(a){
  const c=el('<div class="card'+(st.open===a.id?" open":"")+'"></div>');
  c.innerHTML='<div class="top"><div class="ic">'+a.e+'</div><div class="ti"><b></b><span></span></div><button class="star">'+(fav.has(a.id)?"⭐":"☆")+'</button></div><div class="tags"></div><div class="more"><p></p><div class="btns"></div></div>';
  c.querySelector("b").textContent=a.t; c.querySelector("span").textContent=a.d;
  const tg_=c.querySelector(".tags"); a.i.forEach(x=>{const t=el('<span class="tag"></span>');t.textContent=I[x];tg_.appendChild(t);});
  const ft=el('<span class="tag"></span>'); ft.textContent={both:"Очно и онлайн",offline:"Очно",online:"Онлайн"}[a.f]; tg_.appendChild(ft);
  c.querySelector(".more p").textContent="Как присоединиться: "+a.how;
  const bt=c.querySelector(".btns");
  bt.appendChild(el('<a class="b" target="_blank" rel="noopener" href="'+a.url+'">Подробнее</a>'));
  if(a.mail) bt.appendChild(el('<a class="b alt" href="mailto:'+a.mail+'?subject='+encodeURIComponent("Хочу вступить: "+a.t)+'">Написать</a>'));
  c.onclick=e=>{ if(e.target.closest("a,.star")) return; st.open=st.open===a.id?null:a.id; render(); };
  c.querySelector(".star").onclick=e=>{ e.stopPropagation(); fav.has(a.id)?fav.delete(a.id):fav.add(a.id); save(); if(tg&&tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); render(); };
  return c;
}
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===st.tab));
  filters(); const l=$("list"); l.innerHTML="";
  if(st.tab==="ev"){
    EV.forEach(x=>{const c=el('<div class="card ev"><div class="date"></div><div class="ti"><b></b><span></span></div></div>');c.querySelector(".date").textContent=x.m;c.querySelector("b").textContent=x.t;c.querySelector("span").textContent=x.d;l.appendChild(c);});
    l.appendChild(el('<div class="card"><div class="btns"><a class="b" target="_blank" rel="noopener" href="https://rsue.ru">Календарь мероприятий на rsue.ru</a></div></div>'));
    return;
  }
  const items=list();
  if(!items.length){ l.innerHTML='<div class="empty">'+(st.tab==="fav"?"Пока пусто. Сохраняйте активности ⭐":"Ничего не найдено. Измените фильтры.")+'</div>'; return; }
  l.appendChild(el('<div class="cnt">Найдено: '+items.length+'</div>'));
  items.forEach(a=>l.appendChild(card(a)));
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{st.tab=b.dataset.t;render();});
$("q").oninput=e=>{st.q=e.target.value;if(st.tab==="ev")st.tab="all";render();};
render();
</script>
</body>
</html>
