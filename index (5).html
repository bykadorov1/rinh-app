career:{long:"Центр развития карьеры помогает студентам выйти на рынок труда: практики и стажировки на предприятиях Ростовской области, ЮФО и СКФО, подготовка резюме и подготовка к собеседованиям. Чем раньше вы начнёте, тем легче будет получить первое место работы. Особенно полезно третьекурсникам и выпускникам, но познакомиться с возможностями можно с первого курса.",where:"Раздел «Центр развития карьеры и практической подготовки обучающихся» на rsue.ru или студенческий совет: sovetrgeurinh@yandex.ru."},
mfc:{long:"Студенческий МФЦ открылся в январе 2026 года как новая сервисная экосистема для обучающихся. Идея в том, чтобы решать вопросы в одном месте, без беготни между кабинетами. Это удобно и новичкам, и старшекурсникам. Загляните, чтобы узнать, какие услуги и справки доступны именно вам.",where:"Раздел «Студенческий МФЦ» на rsue.ru или главный корпус, ул. Б. Садовая, 69. График и услуги уточняйте на месте."}
};
A.forEach(a => Object.assign(a, X[a.id]));
const EXTRA = { /* Заполните, например: sovet:{contact:"@username, +7 900 000-00-00", when:"Пн и Чт, 15:00, ауд. 100. Набор до 30 сентября"} */ };
A.forEach(a => Object.assign(a, EXTRA[a.id] || {}));
const FIRST = ["sovet","vol","skc","sport","mfc"];
const EV = [
{m:"17 фев",t:"День российских студенческих отрядов",d:"Встречи и дискуссии в Точке кипения (по материалам прошлых лет)."},
{m:"Весна",t:"«Студенческая весна»",d:"Ежегодный творческий праздник; в 2025 году прошёл 6 апреля."},
{m:"Ежегодно",t:"Фестиваль «Мы вместе!»",d:"Интернациональный межвузовский фестиваль, который проводится с 2008 года."},
{m:"Декабрь",t:"Премии «Золотые страницы РИНХа» и «Ветка каштана»",d:"Награждение лучших студентов и преподавателей."}
];
const st = {tab:"all",q:"",int:new Set(),lvl:"",fmt:"any",open:null};
let fav = new Set(); try { fav = new Set(JSON.parse(localStorage.getItem("fav")||"[]")); } catch(e){}
const save = () => { try { localStorage.setItem("fav", JSON.stringify([...fav])); } catch(e){} };
document.getElementById("stat").textContent = A.length + " активностей и центров";
const $ = id => document.getElementById(id);
function hit(a){ const q = st.q.trim().toLowerCase(); return !q || (a.t+" "+a.d+" "+a.i.map(x=>I[x]).join(" ")).toLowerCase().includes(q); }
function list(){
  const base = st.tab==="fav" ? A.filter(a=>fav.has(a.id)) : A;
  return base.map(a=>({a,s:a.i.filter(x=>st.int.has(x)).length})).filter(({a,s})=>hit(a)&&(!st.first||FIRST.includes(a.id))&&(!st.int.size||s>0)).sort((x,y)=>y.s-x.s).map(x=>x.a);
}
function el(h){ const d=document.createElement("div"); d.innerHTML=h; return d.firstElementChild; }
function filters(){
  const f=$("filters"); f.innerHTML="";
  if(st.tab!=="all") return;
  const row=el('<div class="row"></div>');
  const fb=el('<button class="chip'+(st.first?" on":"")+'">🌟 Первокурснику</button>'); fb.onclick=()=>{st.first=!st.first;render();}; row.appendChild(fb);
  for(const k in I){ const b=el('<button class="chip'+(st.int.has(k)?" on":"")+'">'+I[k]+'</button>'); b.onclick=()=>{st.int.has(k)?st.int.delete(k):st.int.add(k);render();}; row.appendChild(b); }
  f.appendChild(row);
}
function card(a){
  const c=el('<div class="card'+(st.open===a.id?" open":"")+'"></div>');
  c.innerHTML='<div class="top"><div class="ic">'+a.e+'</div><div class="ti"><b></b><span></span></div><button class="star">'+(fav.has(a.id)?"⭐":"☆")+'</button></div><div class="tags"></div><div class="more"><p class="lg"></p><p class="wh"></p><div class="btns"></div></div>';
  c.querySelector("b").textContent=a.t; c.querySelector("span").textContent=a.d;
  const tg_=c.querySelector(".tags"); a.i.forEach(x=>{const t=el('<span class="tag"></span>');t.textContent=I[x];tg_.appendChild(t);});
  const ft=el('<span class="tag"></span>'); ft.textContent={both:"Очно и онлайн",offline:"Очно",online:"Онлайн"}[a.f]; tg_.appendChild(ft);
  c.querySelector(".lg").textContent=a.long; c.querySelector(".wh").textContent="Куда обращаться: "+a.where+" "+a.how+(a.contact?"\nКонтакт: "+a.contact:"")+"\nКогда: "+(a.when||"расписание и набор уточняются");
  const bt=c.querySelector(".btns");
  bt.appendChild(el('<a class="b" target="_blank" rel="noopener" href="'+a.url+'">Подробнее</a>'));
  const ap=el('<button class="b">Записаться</button>'); ap.onclick=()=>contacts(a); bt.insertBefore(ap,bt.firstChild);
  const sh=el('<button class="b alt">Поделиться</button>'); sh.onclick=()=>{const u="https://t.me/share/url?url="+encodeURIComponent("https://t.me/rinh_activities_bot")+"&text="+encodeURIComponent(a.t+": смотри в каталоге активностей РГЭУ (РИНХ)"); tg&&tg.openTelegramLink?tg.openTelegramLink(u):window.open(u,"_blank");}; bt.appendChild(sh);
  c.onclick=e=>{ if(e.target.closest("a,.star")) return; st.open=st.open===a.id?null:a.id; render(); };
  c.querySelector(".star").onclick=e=>{ e.stopPropagation(); fav.has(a.id)?fav.delete(a.id):fav.add(a.id); save(); if(tg&&tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); render(); };
  return c;
}
let me = null; try { me = JSON.parse(localStorage.getItem("me") || "null"); } catch(e) {}
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
const say = m => tg && tg.showAlert ? tg.showAlert(m) : alert(m);
const tu = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
const COURSES = ["1 курс","2 курс","3 курс","4 курс","5 курс","Магистратура","Аспирантура"];
const FAC = ["Менеджмента и предпринимательства","Торговое дело","Компьютерных технологий и информационной безопасности","Учетно-экономический","Юридический","Лингвистики и журналистики","Другой"];
function closeModal() { if (st.modal) st.modal.remove(); st.modal = null; render(); }
function copy(t) {
  const ok = () => say("Скопировано");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, () => say(t));
  else say(t);
}
function contacts(a) {
  const ov = el('<div class="ov"><div class="sheet"><div class="hd"><b></b><button class="x">✕</button></div><p class="hint">Запись проходит напрямую у организаторов. Приложение ничего не отправляет автоматически.</p><div class="rows"></div><div class="btns"></div></div></div>');
  ov.querySelector("b").textContent = "Как записаться: " + a.t;
  const rows = [
    ["📍", "Куда обращаться", a.where + " " + a.how],
    ["📞", "Контакт руководителя", a.contact || "уточняется у студсовета"],
    ["🕒", "Когда", a.when || "расписание и набор уточняются"],
    ["✉️", "Почта студенческого совета", M, M],
    ["🏛", "Адрес", "Ростов-на-Дону, ул. Б. Садовая, 69 (главный корпус)", "Ростов-на-Дону, ул. Б. Садовая, 69"]
  ];
  rows.forEach(r => {
    const d = el('<div class="cr"><small></small><span></span></div>');
    d.querySelector("small").textContent = r[0] + " " + r[1]; d.querySelector("span").textContent = r[2];
    if (r[3]) { const b = el('<button class="cp">Копировать</button>'); b.onclick = () => copy(r[3]); d.appendChild(b); }
    ov.querySelector(".rows").appendChild(d);
  });
  const bt = ov.querySelector(".btns");
  bt.appendChild(el('<a class="b alt" target="_blank" rel="noopener" href="' + a.url + '">Сайт университета</a>'));
  ov.querySelector(".x").onclick = closeModal;
  ov.onclick = e => { if (e.target === ov) closeModal(); };
  document.body.appendChild(ov); st.modal = ov; render();
}
function cabinet(l) {
  if (!me || st.edit) {
    const c = el('<div class="card"><b>Вход в личный кабинет</b><p class="hint">Укажите данные один раз: они подставятся в заявки на активности. Данные подставятся в письмо организаторам, если вы решите его написать. Хранятся только на вашем устройстве и никуда не отправляются автоматически.</p><input id="fio" placeholder="Фамилия Имя Отчество" autocomplete="name"><select id="crs"></select><select id="fac"></select><label class="chk"><input type="checkbox" id="ok"><span>Согласен сохранить ФИО и курс на этом устройстве</span></label><div class="err" id="er"></div><button class="b" id="go">Войти</button></div>');
    COURSES.forEach(x => c.querySelector("#crs").add(new Option(x, x, 0, me && me.course === x)));
    c.querySelector("#crs").insertBefore(new Option("Выберите курс", "", 1, !me), c.querySelector("#crs").firstChild);
    c.querySelector("#fac").add(new Option("Факультет (по желанию)", ""));
    FAC.forEach(x => c.querySelector("#fac").add(new Option(x, x, 0, me && me.fac === x)));
    if (me) c.querySelector("#fio").value = me.fio;
    c.querySelector("#go").onclick = () => {
      const fio = c.querySelector("#fio").value.trim().replace(/\s+/g, " "), crs = c.querySelector("#crs").value, er = c.querySelector("#er");
      if (fio.split(" ").length < 2) { er.textContent = "Введите фамилию и имя (отчество по желанию)."; return; }
      if (!crs) { er.textContent = "Выберите курс."; return; }
      if (!c.querySelector("#ok").checked) { er.textContent = "Нужно согласие на обработку данных."; return; }
      me = {fio, course: crs, fac: c.querySelector("#fac").value}; put("me", me); st.edit = false; render();
    };
    l.appendChild(c); return;
  }
  const p = el('<div class="card"><div class="top"><div class="ic">👤</div><div class="ti"><b></b><span></span></div></div><div class="btns"><button class="b alt" id="ed">Изменить</button><button class="b alt" id="lo">Выйти</button></div></div>');
  p.querySelector("b").textContent = me.fio;
  p.querySelector("span").textContent = me.course + (me.fac ? ", " + me.fac : "") + (tu && tu.username ? " · @" + tu.username : "");
  p.querySelector("#ed").onclick = () => { st.edit = true; render(); };
  p.querySelector("#lo").onclick = () => { const out = () => { me = null; try { localStorage.removeItem("me"); } catch(e) {} render(); }; const q = "Выйти и удалить профиль и список заявок с этого устройства?"; if (tg && tg.showConfirm) tg.showConfirm(q, ok => ok && out()); else if (confirm(q)) out(); };
  l.appendChild(p);
  l.appendChild(el('<div class="cnt">В избранном: ' + fav.size + '</div>'));
}
function render(){
  if(tg&&tg.BackButton){ (st.tab!=="all"||st.open||st.modal)?tg.BackButton.show():tg.BackButton.hide(); }
  $("hp").textContent = me ? "Привет, " + (me.fio.split(" ")[1] || me.fio) + "! Найди, чем заняться в университете" : "Найди клуб, центр или секцию по интересам";
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===st.tab));
  filters(); const l=$("list"); l.innerHTML="";
  if(st.tab==="me"){ cabinet(l); return; }
  if(st.tab==="ev"){
    EV.forEach(x=>{const c=el('<div class="card ev"><div class="date"></div><div class="ti"><b></b><span></span></div></div>');c.querySelector(".date").textContent=x.m;c.querySelector("b").textContent=x.t;c.querySelector("span").textContent=x.d;l.appendChild(c);});
    l.appendChild(el('<div class="card"><div class="btns"><a class="b" target="_blank" rel="noopener" href="https://rsue.ru">Календарь мероприятий на rsue.ru</a></div></div>'));
    return;
  }
  const items=list();
  if(!items.length){ l.innerHTML='<div class="empty">'+(st.tab==="fav"?"Пока пусто. Сохраняйте активности ⭐":"Ничего не найдено. Измените фильтры.")+'</div>'; return; }
  l.appendChild(el('<div class="cnt">Найдено: '+items.length+'</div>'));
  items.forEach(a=>l.appendChild(card(a)));
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{st.tab=b.dataset.t;render();});
$("q").oninput=e=>{st.q=e.target.value;if(st.tab!=="all"&&st.tab!=="fav")st.tab="all";render();};
if(tg&&tg.BackButton) tg.BackButton.onClick(()=>{ if(st.modal){ st.modal.remove(); st.modal=null; } else if(st.open) st.open=null; else { st.tab="all"; st.edit=false; } render(); });
render();
</script>
</body>
</html>
